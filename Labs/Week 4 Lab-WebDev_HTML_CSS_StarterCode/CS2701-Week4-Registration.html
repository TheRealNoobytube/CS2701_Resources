<!DOCTYPE html>
<html lang="en">
    <head>
        <title>
            Fresh Food For All
        </title>
        <link rel="stylesheet" href="CS2701-Week4-Registration.css">
    </head>
    <body>
        <header></header>
        <nav>
            <ul class="navlist">
                <li>Home</li>
                <li>Register</li>
                <li>Login</li>
                <li>Help</li>
            </ul>
         </nav>
        <main>
            <!-- Check Week 4 Lecture to learn about HTML5 semantic elements-->
            <aside>
                <input type="search" class="search" name="search" placeholder="Search">
            </aside>


            <section>
                <form class="center" novalidate>
                <!-- ToDo: Implement the form containing 
                           Name - type text
                           email- type text
                           password - type text
                           Terms of Service - type checkbox
                           Register - button
                           Learn more - link
                           Check lecture slides and the links on the slides to learn about forms
                           and how to create a button that would react to a click Event
                        -->
                    <!-- Example given for user type checkboxes-->
                    
                    Name:<br><input type = "text" id="name" name="name"><br><br>
                    Email:<br><input type = "text" id="email" name="email"><br><br>
                    Password:<br><input type = "text" id="password1" name="password1"><br><br>
                    Re-type Password:<br><input type = "password2" id="name" name="password2"><br><br>

                    <input type="checkbox" id="buyer" name="buyer" value="buyer">
                    <label for="buyer">I want to buy produce directly from allotment owners.</label><br>
                    <input type="checkbox" id="seller" name="seller" value="seller">
                    <label for="seller">I want to sell produce from my allotment.</label><br><br>

                    <input type="checkbox" id="agreement" name="agreement" value="agreement">
                    <label for="agreement">I agree to the <a href>Terms of Use</a> and <a href>Privacy Policy</a>.</label><br><br>

                    <input type="button" id="register" name="register" value="Register">
                    <a href>Learn more</a>

                    <br>
                </form>
                <div class="center" id="hiddenSection">
                    <p id="hiddenParagraph"></p>
                </div>
            </section>
        </main>
    </body>
</html>
